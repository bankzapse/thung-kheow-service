name: keep-alive

# กัน Supabase Free "หลับ" (pause หลังไม่มี activity 7 วัน) — ยิง endpoint ที่แตะ DB ทุก 3 วัน
on:
  schedule:
    - cron: "0 3 */3 * *" # ทุก 3 วัน 03:00 UTC (~10:00 ไทย)
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health/db (keep Supabase awake)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://thung-kheow.com/api/health/db)
          echo "health/db -> HTTP $code"
          test "$code" = "200"
